<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
    </head>
    <body style="background-color: rgb(8, 112, 248);">
        <div class="background">
            <p class="titre" align="center">Formulaire de gestion de document</p>
            <div class="bord1">
                <p class="titre1">Caractrestique du document</p>
                <form>  
                    <label for="mouvement" class="N1" id="mouvement">Mouvement :</label>
                     <input type="text" name="mouvement" id="mouvement" class="N1">
                    <label for="Dossier" class="N1" id="Dossier">N°Dossier :</label>
                     <input type="text" name="Dossier" id="Dossier" class="N1"><br>
                    <label for="Dossier" class="N1" id="titre">Titre :</label>
                     <input type="text" name="titre" id="titre" class="N1"><br>
                    <label for="Dossier" class="N1" id="classe">Classe dans :</label>
                     <input type="text" name="classe" id="classe" class="N1">
                </form>
            </div>
            <div class="bord2">
               <div>
                <p class="titre2">Caractrestique du document</p>
                <label for="organisme" class="N1" id="organisme">Organisme :</label>
                 <input type="text" name="organisme" id="organisme" class="N1">
                <label for="Signataire" class="N1" id="Signataire">Signataire :</label>
                 <input type="text" name="Signataire" id="Signataire" class="N1"><br>
                <label for="postal" class="N1" id="postal">Code postal :</label>
                 <input type="text" name="postal" id="postal" class="N1">
                <label for="Ville" class="N1" id="Ville">Ville :</label>
                 <input type="text" name="Ville" id="Ville" class="N1">
              </div>  
              <div>
                <label for="Pays" class="N2">Pays :</label>
                <select name="Pays" id="Pays">
                  <option  value="france">france</option>
                  <option  value="italie">italie</option>
                  <option  value="algerie">algerie</option>
                  <option  value="maroc">maroc</option>
                </select><br>
                <label for="Adresse" class="N3">Adresse :</label><br>
                <textarea name="Adresse" id="Adresse" class="N1"></textarea>
              </div>
            </div>        
    </body>
</html>
